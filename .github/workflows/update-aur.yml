name: Update gproxy-bin and push to AUR

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Force pkgrel bump and push to AUR'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  update-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch latest gproxy release
        id: rel
        run: |
          data=$(curl -sfL -H "Authorization: Bearer ${{ github.token }}" \
            https://api.github.com/repos/LeenHawk/gproxy/releases/latest)
          ver=$(echo "$data" | jq -r '.tag_name' | sed 's/^v//')
          x86_sha=$(echo "$data" | jq -r '.assets[] | select(.name=="gproxy-linux-x86_64.zip") | .digest' | sed 's/^sha256://')
          aarch64_sha=$(echo "$data" | jq -r '.assets[] | select(.name=="gproxy-linux-aarch64.zip") | .digest' | sed 's/^sha256://')

          # Refuse to continue on bad data (rate limit, missing digest, ...)
          if [ -z "$ver" ] || [ "$ver" = "null" ]; then
            echo "::error::failed to read release version"; exit 1
          fi
          for s in "$x86_sha" "$aarch64_sha"; do
            if ! [[ "$s" =~ ^[0-9a-f]{64}$ ]]; then
              echo "::error::invalid sha256 '$s'"; exit 1
            fi
          done

          echo "version=$ver" >> "$GITHUB_OUTPUT"
          echo "x86_64_sha=$x86_sha" >> "$GITHUB_OUTPUT"
          echo "aarch64_sha=$aarch64_sha" >> "$GITHUB_OUTPUT"

      - name: Query AUR
        id: aur
        run: |
          info=$(curl -s "https://aur.archlinux.org/rpc/v5/info/gproxy-bin")
          count=$(echo "$info" | jq -r '.resultcount')
          aur_ver=$(echo "$info" | jq -r '.results[0].Version // ""')
          echo "exists=$([ "$count" != "0" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "version=$aur_ver" >> "$GITHUB_OUTPUT"

      - name: Decide whether a push is needed
        id: check
        run: |
          cur_ver=$(grep -Po '(?<=^pkgver=).*' PKGBUILD)
          cur_rel=$(grep -Po '(?<=^pkgrel=).*' PKGBUILD)
          cur_x86=$(grep -Po "(?<=^sha256sums_x86_64=\(')[0-9a-f]+" PKGBUILD || true)
          cur_arm=$(grep -Po "(?<=^sha256sums_aarch64=\(')[0-9a-f]+" PKGBUILD || true)

          new_ver="${{ steps.rel.outputs.version }}"
          changed=false
          rel="$cur_rel"

          if [ "$cur_ver" != "$new_ver" ]; then
            echo "new upstream version: $cur_ver -> $new_ver"
            rel=1; changed=true
          elif [ "$cur_x86" != "${{ steps.rel.outputs.x86_64_sha }}" ] || \
               [ "$cur_arm" != "${{ steps.rel.outputs.aarch64_sha }}" ]; then
            echo "same version but sha256 changed upstream, bumping pkgrel"
            rel=$((cur_rel + 1)); changed=true
          elif [ "${{ inputs.force }}" = "true" ]; then
            echo "forced run, bumping pkgrel"
            rel=$((cur_rel + 1)); changed=true
          elif [ "${{ steps.aur.outputs.exists }}" = "false" ] || \
               [ "${{ steps.aur.outputs.version }}" != "${cur_ver}-${cur_rel}" ]; then
            echo "AUR (${{ steps.aur.outputs.version }}) out of sync with repo (${cur_ver}-${cur_rel})"
            changed=true
          fi

          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          echo "pkgrel=$rel" >> "$GITHUB_OUTPUT"

      - name: Bump PKGBUILD
        if: steps.check.outputs.changed == 'true'
        run: |
          sed -i "s/^pkgver=.*/pkgver=${{ steps.rel.outputs.version }}/" PKGBUILD
          sed -i "s/^pkgrel=.*/pkgrel=${{ steps.check.outputs.pkgrel }}/" PKGBUILD
          sed -i "s/^sha256sums_x86_64=.*/sha256sums_x86_64=('${{ steps.rel.outputs.x86_64_sha }}')/" PKGBUILD
          sed -i "s/^sha256sums_aarch64=.*/sha256sums_aarch64=('${{ steps.rel.outputs.aarch64_sha }}')/" PKGBUILD

      - name: Regenerate .SRCINFO (needs makepkg, run in Arch container)
        if: steps.check.outputs.changed == 'true'
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -v "$PWD":/repo -w /repo \
            archlinux:base-devel \
            bash -c "export HOME=/tmp; makepkg --printsrcinfo > .SRCINFO"

      - name: Commit changes to GitHub
        if: steps.check.outputs.changed == 'true'
        run: |
          git config user.name "gproxy-bin-bot"
          git config user.email "actions@users.noreply.github.com"
          git add PKGBUILD .SRCINFO
          if git diff --cached --quiet; then
            echo "no PKGBUILD/.SRCINFO changes to commit"
          else
            git commit -m "chore: bump gproxy-bin to ${{ steps.rel.outputs.version }}-${{ steps.check.outputs.pkgrel }}"
            git push origin HEAD:main
          fi

      - name: Push to AUR
        if: steps.check.outputs.changed == 'true'
        env:
          SSH_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -t ed25519 aur.archlinux.org >> ~/.ssh/known_hosts 2>/dev/null

          git clone ssh://aur@aur.archlinux.org/gproxy-bin.git aur-repo
          cp PKGBUILD .SRCINFO gproxy.service gproxy.env gproxy-bin.install aur-repo/
          cd aur-repo
          git checkout -B master
          git config user.name "gproxy-bin-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "nothing to push"
            exit 0
          fi
          git commit -m "gproxy-bin ${{ steps.rel.outputs.version }}-${{ steps.check.outputs.pkgrel }}"
          git push origin master
